services:
  postgres:
    image: postgres:16
    container_name: incident-copilot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: incident_copilot
      POSTGRES_USER: incident_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_admin -d incident_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
